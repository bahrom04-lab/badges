[package]
name = "badge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.186"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
